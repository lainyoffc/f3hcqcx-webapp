<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <meta name="theme-color" content="#111315">
  <title>Отзывы — F3hcqcx Stars</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="api-config.js"></script>
  <style>
    :root{color-scheme:dark}*{box-sizing:border-box}
    body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:radial-gradient(circle at top,#2b3036 0%,#17191c 42%,#0d0f11 100%);color:#f4f6f8;min-height:100vh}
    .wrap{max-width:640px;margin:auto;padding:16px}.card{background:linear-gradient(180deg,#25282c,#1a1d20);border:1px solid #ffffff12;border-radius:20px;padding:18px;margin-bottom:14px;box-shadow:0 12px 34px #0006}
    .head{text-align:center;padding:24px 18px}.head h1{margin:0 0 10px;font-size:24px}.avg{font-size:40px;font-weight:800;line-height:1.1}.stars{color:#ffd54a;font-size:24px;letter-spacing:2px;margin-top:5px}.muted{color:#a9b0b8;font-size:14px}
    .tabs{display:flex;gap:8px;overflow:auto;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}.tab{border:1px solid #ffffff18;background:#ffffff07;color:#cfd4da;border-radius:999px;padding:10px 14px;white-space:nowrap;cursor:pointer}.tab.active{background:#3a3f45;color:#fff;border-color:#ffffff22}
    .list{display:flex;flex-direction:column;gap:12px}.review{padding:16px}.review-top{display:flex;justify-content:space-between;gap:10px}.review-user{font-weight:700}.review-date{font-size:12px;color:#8e969f}.review-stars{color:#ffd54a;font-size:20px;margin:8px 0}.review-text{line-height:1.5;white-space:pre-wrap;overflow-wrap:anywhere;color:#e8ebee}.product{margin-top:10px;font-size:13px;background:#ffffff08;border:1px solid #ffffff0c;border-radius:10px;padding:8px;color:#c7cdd3}
    .empty,.loading{text-align:center;padding:30px 10px;color:#9ba3ab}.err{background:#4a2323;border:1px solid #8f4646;color:#ffd8d8;padding:12px;border-radius:12px;margin-bottom:12px}.row{display:flex;gap:8px;align-items:center}
    .btn{border:0;border-radius:12px;padding:11px 14px;cursor:pointer;font-weight:700}.btn-primary{background:#f0f2f4;color:#17191c}.btn-ghost{background:#ffffff08;color:#d7dce1;border:1px solid #ffffff15}.refresh{margin-top:10px}
    .field{width:100%;border:1px solid #ffffff16;background:#111315;color:#f3f5f7;border-radius:12px;padding:11px}.field::placeholder{color:#727a84}.form{display:none;gap:10px}.form.show{display:grid}.stars-input{display:flex;gap:4px}.star-btn{border:0;background:transparent;color:#50565d;font-size:30px;cursor:pointer}.star-btn.active{color:#ffd54a}.small{font-size:12px;color:#7f8790}.channel-note{text-align:center;border:1px dashed #ffffff18;background:#141618}.label{font-size:13px;color:#a9b0b8;margin-bottom:5px;display:block}.select{appearance:none}
  </style>
</head>
<body>
<div class="wrap">
  <div id="error"></div>
  <section class="card head"><h1>⭐ Отзывы клиентов</h1><div class="avg" id="avg">—</div><div class="stars">★★★★★</div><div class="muted" id="count">Загрузка…</div><button class="btn btn-ghost refresh" id="refresh">↻ Обновить</button></section>
  <section class="card"><div class="tabs"><button class="tab active" data-filter="all">Все</button><button class="tab" data-filter="positive">Позитивные</button><button class="tab" data-filter="negative">Негативные</button></div></section>
  <section class="card"><div class="row" style="justify-content:space-between"><strong>Оставить отзыв</strong><button class="btn btn-primary" id="open-form">Написать</button></div><div class="form" id="form">
    <div><label class="label" for="review-name">Как вас указать</label><input class="field" id="review-name" maxlength="50" placeholder="Например: Лейни"></div>
    <div><label class="label" for="review-product">Что именно покупали</label><select class="field select" id="review-product">
      <option value="Telegram Stars">⭐ Telegram Stars</option>
      <option value="Медведь">🧸 Медведь</option>
      <option value="Сердце">❤️ Сердце</option>
      <option value="Кольцо">💍 Кольцо</option>
      <option value="Роза">🌹 Роза</option>
      <option value="Алмаз">💎 Алмаз</option>
      <option value="Другое">🎁 Другой подарок</option>
    </select></div>
    <div><label class="label">Оценка</label><div class="stars-input" id="stars-input"></div></div>
    <textarea class="field" id="review-text" rows="4" maxlength="500" placeholder="Напишите отзыв (5–500 символов)"></textarea>
    <div class="row"><button class="btn btn-primary" id="send">Отправить</button><button class="btn btn-ghost" id="cancel">Отмена</button></div>
    <div class="small">Имя и конкретный подарок/товар будут показаны вместе с отзывом.</div>
  </div></section>
  <section class="list" id="list"><div class="loading">⏳ Загрузка отзывов…</div></section>
  <section class="card channel-note muted">Отзывы из канала <b>@OtziviF3hcqcx1</b> автоматически появляются здесь после новых публикаций.</section>
</div>
<script>
const tg=window.Telegram?.WebApp;if(tg){tg.ready();tg.expand()}
const RENDER_API='https://f3hcqcx-reviews-api.onrender.com';
const SUPABASE_API='https://ojodvcnikqduwhjlgrag.supabase.co/functions/v1/reviews-public';
let allReviews=[],currentFilter='all',selectedRating=5;
function esc(s){const d=document.createElement('div');d.textContent=String(s??'');return d.innerHTML}
function stars(n){n=Math.max(0,Math.min(5,Number(n)||0));return '★'.repeat(n)+'☆'.repeat(5-n)}
function showError(msg){document.getElementById('error').innerHTML=msg?`<div class="err">${esc(msg)}</div>`:''}
function render(){let items=allReviews;if(currentFilter==='positive')items=items.filter(r=>r.rating>=4);if(currentFilter==='negative')items=items.filter(r=>r.rating<4);const box=document.getElementById('list');if(!items.length){box.innerHTML='<div class="card empty">📭 Отзывов пока нет.</div>';return}box.innerHTML=items.map(r=>`<article class="card review"><div class="review-top"><span class="review-user">${esc(r.user||'Клиент')}</span><span class="review-date">${esc(new Date(r.date).toLocaleDateString('ru-RU'))}</span></div><div class="review-stars">${stars(r.rating)}</div><div class="review-text">${esc(r.text)}</div>${r.product?`<div class="product">📦 ${esc(r.product)}</div>`:''}</article>`).join('')}
function calcStats(items){const total=items.length;const average=total?items.reduce((sum,r)=>sum+Number(r.rating||0),0)/total:0;return{total,average:Math.round(average*10)/10}}
async function load(){showError('');try{const [sRes,rRes]=await Promise.all([fetch(`${SUPABASE_API}?limit=100&t=${Date.now()}`,{cache:'no-store'}),fetch(`${RENDER_API}/api/reviews?limit=100&t=${Date.now()}`,{cache:'no-store'})]);const sup=sRes.ok?await sRes.json():{reviews:[]};const ren=rRes.ok?await rRes.json():{reviews:[]};const merged=[...(Array.isArray(sup.reviews)?sup.reviews:[]),...(Array.isArray(ren.reviews)?ren.reviews:[])];const byId=new Map();for(const r of merged){if(!r?.id)continue;byId.set(r.id,r)}allReviews=[...byId.values()].sort((a,b)=>new Date(b.date)-new Date(a.date));const s=calcStats(allReviews);document.getElementById('avg').textContent=s.average.toFixed(1);document.getElementById('count').textContent=`${s.total} отзывов`;render()}catch(e){showError('Не удалось загрузить отзывы.');document.getElementById('list').innerHTML='<div class="card empty">Попробуйте обновить страницу позже.</div>'}}
function initStars(){const box=document.getElementById('stars-input');box.innerHTML='';for(let i=1;i<=5;i++){const b=document.createElement('button');b.type='button';b.className='star-btn'+(i<=selectedRating?' active':'');b.textContent='★';b.onclick=()=>{selectedRating=i;initStars()};box.appendChild(b)}}
function prefillName(){const user=tg?.initDataUnsafe?.user;if(user){const name=user.first_name||user.username||'';if(name&&!document.getElementById('review-name').value)document.getElementById('review-name').value=name}}
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));b.classList.add('active');currentFilter=b.dataset.filter;render()});document.getElementById('refresh').onclick=load;document.getElementById('open-form').onclick=()=>{document.getElementById('form').classList.add('show');prefillName()};document.getElementById('cancel').onclick=()=>document.getElementById('form').classList.remove('show');
document.getElementById('send').onclick=async()=>{showError('');const name=document.getElementById('review-name').value.trim();const product=document.getElementById('review-product').value;const text=document.getElementById('review-text').value.trim();if(name.length<2){showError('Укажите имя от 2 символов.');return}if(text.length<5){showError('Минимум 5 символов.');return}if(!tg?.initData){showError('Откройте отзывы из Telegram-бота.');return}try{const res=await fetch(`${RENDER_API}/api/reviews`,{method:'POST',headers:{'Content-Type':'application/json','X-Telegram-Init-Data':tg.initData},body:JSON.stringify({rating:selectedRating,text,user_name:name,product})});const data=await res.json();if(!res.ok)throw new Error(data.detail||'Ошибка отправки');document.getElementById('review-name').value='';document.getElementById('review-text').value='';document.getElementById('form').classList.remove('show');await load()}catch(e){showError(e.message)}};initStars();load();
</script>
</body>
</html>
