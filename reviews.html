<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <title>Отзывы — F3hcqcx Stars</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="api-config.js"></script>
  <style>
    *{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:linear-gradient(135deg,#4facfe,#00f2fe);color:#fff;min-height:100vh}.wrap{max-width:640px;margin:auto;padding:16px}.card{background:#ffffff18;border:1px solid #ffffff2b;border-radius:20px;padding:18px;margin-bottom:14px;backdrop-filter:blur(12px);box-shadow:0 8px 30px #0001}.head{text-align:center}.head h1{margin:0 0 8px}.avg{font-size:36px;font-weight:800}.stars{color:#ffd700;font-size:24px;letter-spacing:2px}.muted{opacity:.75;font-size:14px}.tabs{display:flex;gap:8px;overflow:auto}.tab{border:1px solid #ffffff3d;background:#ffffff14;color:#fff;border-radius:999px;padding:10px 14px;white-space:nowrap}.tab.active{background:#ffffff38}.list{display:flex;flex-direction:column;gap:12px}.review{padding:16px}.review-top{display:flex;justify-content:space-between;gap:10px}.review-user{font-weight:700}.review-date{font-size:12px;opacity:.7}.review-stars{color:#ffd700;font-size:20px;margin:8px 0}.review-text{line-height:1.5;white-space:pre-wrap;overflow-wrap:anywhere}.product{margin-top:10px;font-size:13px;background:#ffffff12;border-radius:10px;padding:8px}.empty,.loading{text-align:center;padding:30px 10px;opacity:.8}.err{background:#ff453a55;border:1px solid #ffb0aa;padding:12px;border-radius:12px;margin-bottom:12px}.row{display:flex;gap:8px;align-items:center}.btn{border:0;border-radius:12px;padding:11px 14px;cursor:pointer;font-weight:700}.btn-primary{background:#fff;color:#1677c8}.btn-ghost{background:#ffffff18;color:#fff;border:1px solid #ffffff30}.field{width:100%;border:1px solid #ffffff3d;background:#ffffff12;color:#fff;border-radius:12px;padding:11px}.field::placeholder{color:#ffffff99}.form{display:none;gap:10px}.form.show{display:grid}.stars-input{display:flex;gap:4px}.star-btn{border:0;background:transparent;color:#ffffff66;font-size:30px}.star-btn.active{color:#ffd700}.small{font-size:12px;opacity:.7}
  </style>
</head>
<body>
<div class="wrap">
  <div id="error"></div>
  <section class="card head"><h1>⭐ Отзывы клиентов</h1><div class="avg" id="avg">—</div><div class="stars">★★★★★</div><div class="muted" id="count">Загрузка…</div></section>
  <section class="card"><div class="tabs"><button class="tab active" data-filter="all">Все</button><button class="tab" data-filter="positive">Позитивные</button><button class="tab" data-filter="negative">Негативные</button></div></section>
  <section class="card"><div class="row" style="justify-content:space-between"><strong>Оставить отзыв</strong><button class="btn btn-primary" id="open-form">Написать</button></div><div class="form" id="form"><div class="stars-input" id="stars-input"></div><textarea class="field" id="review-text" rows="4" maxlength="500" placeholder="Напишите отзыв (5–500 символов)"></textarea><div class="row"><button class="btn btn-primary" id="send">Отправить</button><button class="btn btn-ghost" id="cancel">Отмена</button></div><div class="small">Оставить отзыв можно из Telegram WebApp. Сервер проверяет Telegram initData.</div></div></section>
  <section class="list" id="list"><div class="loading">⏳ Загрузка отзывов…</div></section>
  <section class="card muted" style="text-align:center">Отзывы из канала <b>@OtziviF3hcqcx1</b> автоматически появляются здесь после публикации.</section>
</div>
<script>
const tg=window.Telegram?.WebApp;if(tg){tg.ready();tg.expand()}const API=(window.REVIEWS_API_URL||'').replace(/\/$/,'');let allReviews=[],currentFilter='all',selectedRating=5;
function esc(s){const d=document.createElement('div');d.textContent=String(s??'');return d.innerHTML}function stars(n){return '★'.repeat(n)+'☆'.repeat(5-n)}function showError(msg){document.getElementById('error').innerHTML=msg?`<div class="err">${esc(msg)}</div>`:''}
function render(){let items=allReviews;if(currentFilter==='positive')items=items.filter(r=>r.rating>=4);if(currentFilter==='negative')items=items.filter(r=>r.rating<4);const box=document.getElementById('list');if(!items.length){box.innerHTML='<div class="card empty">📭 Отзывов пока нет.</div>';return}box.innerHTML=items.map(r=>`<article class="card review"><div class="review-top"><span class="review-user">${esc(r.user||'Клиент')}</span><span class="review-date">${esc(new Date(r.date).toLocaleDateString('ru-RU'))}</span></div><div class="review-stars">${stars(Number(r.rating)||0)}</div><div class="review-text">${esc(r.text)}</div>${r.product?`<div class="product">📦 ${esc(r.product)}</div>`:''}</article>`).join('')}
async function load(){showError('');if(!API){showError('API отзывов ещё не настроен.');return}try{const res=await fetch(`${API}/api/reviews?limit=50`);if(!res.ok)throw new Error('HTTP '+res.status);const data=await res.json();allReviews=Array.isArray(data.reviews)?data.reviews:[];const s=data.stats||{};document.getElementById('avg').textContent=Number(s.average||0).toFixed(1);document.getElementById('count').textContent=`${s.total||0} отзывов`;render()}catch(e){showError('Не удалось загрузить отзывы.');document.getElementById('list').innerHTML='<div class="card empty">Попробуйте обновить страницу позже.</div>'}}
function initStars(){const box=document.getElementById('stars-input');box.innerHTML='';for(let i=1;i<=5;i++){const b=document.createElement('button');b.type='button';b.className='star-btn'+(i<=selectedRating?' active':'');b.textContent='★';b.onclick=()=>{selectedRating=i;initStars()};box.appendChild(b)}}
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));b.classList.add('active');currentFilter=b.dataset.filter;render()});document.getElementById('open-form').onclick=()=>document.getElementById('form').classList.add('show');document.getElementById('cancel').onclick=()=>document.getElementById('form').classList.remove('show');
document.getElementById('send').onclick=async()=>{showError('');const text=document.getElementById('review-text').value.trim();if(text.length<5){showError('Минимум 5 символов.');return}if(!tg?.initData){showError('Откройте отзывы из Telegram-бота.');return}try{const res=await fetch(`${API}/api/reviews`,{method:'POST',headers:{'Content-Type':'application/json','X-Telegram-Init-Data':tg.initData},body:JSON.stringify({rating:selectedRating,text})});const data=await res.json();if(!res.ok)throw new Error(data.detail||'Ошибка отправки');document.getElementById('review-text').value='';document.getElementById('form').classList.remove('show');await load()}catch(e){showError(e.message)}};initStars();load();
</script></body></html>
